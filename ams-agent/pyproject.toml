[project]
name = "ams-agent"
version = "0.1.0"
description = "The AMS HR agent, built step by step (BUILD_STEPS.md)"
requires-python = ">=3.14"
dependencies = [
    "ams-assistant",
    "langchain>=1.5.2",
    "langchain-anthropic>=1.7.13",
    "langchain-google-genai>=4.4.3",
    "langchain-ollama>=1.2.0",
    "python-dotenv>=1.2.4",
    "streamlit>=1.67.0",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
ams-assistant = { path = "../ams-assistant", editable = true }
