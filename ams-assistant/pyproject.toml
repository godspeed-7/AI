[project]
name = "ams-assistant"
version = "0.1.0"
description = "AMS policy RAG and HR agents, built with LangChain and LangGraph"
readme = "README.md"
authors = [
    { name = "Ankit Singh", email = "ankitsingh80741@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "langchain>=1.4.9",
    "langchain-core>=1.7.0",
    "langchain-google-genai>=4.4.3",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.3",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "langfuse>=5.2.0",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "mcp>=2.3.0",
    "sentence-transformers>=6.1.0",
    "streamlit>=1.67.0",
]

[project.scripts]
ams-assistant = "ams_assistant:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
